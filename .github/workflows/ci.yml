name: Continuous Integration

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'Docs/**'
      - 'README.md'
      - 'output/**'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Verify Formatting
        run: |
          UNFORMATTED=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$UNFORMATTED" ]; then
            echo "❌ Code format issues found in following files:"
            echo "$UNFORMATTED"
            exit 1
          fi
          echo "✅ All Go files formatted properly."

      - name: Run Go Vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
        continue-on-error: true

  vuln-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.24'
          go-package: ./...

  test:
    name: Unit & Integration Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.23', '1.24']
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Run Unit Tests with Race Detector & Coverage
        run: |
          go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload Coverage Report (Ubuntu only)
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.24'
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-report
          path: coverage.out
          retention-days: 14

  integration-e2e:
    name: API & SVG Output Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build Binary
        run: go build -o bin/github-contribution-city cmd/city/main.go

      - name: Test Mock & Public Generation
        run: |
          mkdir -p output
          # Test public user generation (e.g. torvalds)
          ./bin/github-contribution-city -user torvalds -format all -output output/test_run

          # Verify that artifacts were created
          test -f output/test_run.svg
          test -f output/test_run_3d.svg
          test -f output/test_run.html
          test -f output/test_run.json

          # Validate SVG structure
          grep -q "<svg" output/test_run.svg
          grep -q "</svg>" output/test_run.svg
          grep -q "Contribution City" output/test_run.svg

          echo "✅ All generated artifacts verified successfully."

  cross-compile:
    name: Multi-Platform Binary Builds
    needs: [test, lint]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi
          OUT="dist/github-contribution-city-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}"
          mkdir -p dist
          go build -ldflags="-s -w" -o "${OUT}" cmd/city/main.go

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 7
