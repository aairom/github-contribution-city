services:
  contribution-city:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/alainairom/github-contribution-city:latest
    container_name: github-contribution-city
    restart: unless-stopped
    ports:
      - "${PORT:-8088}:8088"
    environment:
      - PORT=8088
      - HOST=0.0.0.0
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_USERNAME=${GITHUB_USERNAME:-torvalds}
      - CITY_WEEKS=${CITY_WEEKS:-53}
      - CITY_MAX_HEIGHT=${CITY_MAX_HEIGHT:-14}
      - CITY_THEME=${CITY_THEME:-github-dark}
    volumes:
      - ./output:/app/output
      - ./input:/app/input
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8088/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
